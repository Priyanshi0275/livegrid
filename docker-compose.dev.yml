version: "3.8"
# Use this for local dev: dashboard runs via Vite (npm run dev), not Docker
# Run: docker compose -f docker-compose.dev.yml up
services:
  target-api:
    build: ./target-api
    container_name: livegrid-target
    ports:
      - "4000:4000"
    networks:
      - livegrid-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: livegrid-server
    ports:
      - "3001:3001"
      - "3002:3002"
    volumes:
      - ./server:/app
      - ./agents:/agents
      - /app/node_modules
    environment:
      - TARGET_URL=http://target-api:4000
      - NODE_ENV=development
    depends_on:
      - target-api
    networks:
      - livegrid-net

networks:
  livegrid-net:
    driver: bridge
